name: 🐛 错误报告
description: 报告项目中遇到的问题或错误
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您花时间填写此错误报告！请提供尽可能详细的信息，以便我们更好地定位和修复问题。
        
  - type: textarea
    id: bug-description
    attributes:
      label: 问题描述
      description: 请清晰简洁地描述您遇到的问题
      placeholder: 例如：在《裂空之羽》战役模式中，点击第3章第5关时页面无响应...
    validations:
      required: true
      
  - type: dropdown
    id: affected-area
    attributes:
      label: 影响范围
      description: 问题发生在哪个模块或页面？
      options:
        - 首页门户
        - 《裂空之羽》- 试玩作战
        - 《裂空之羽》- 战役关卡
        - 《裂空之羽》- 策划文档
        - 《最终幻想：时空之轮》- 技术白皮书
        - 《最终幻想：时空之轮》- 核心架构系统
        - 《最终幻想：时空之轮》- 更新演进
        - 项目构建或部署
        - 其他
    validations:
      required: true
      
  - type: textarea
    id: reproduction-steps
    attributes:
      label: 复现步骤
      description: 请提供详细的步骤来重现这个问题
      placeholder: |
        1. 访问 '...'
        2. 点击 '...'
        3. 滚动到 '...'
        4. 看到错误
    validations:
      required: true
      
  - type: textarea
    id: expected-behavior
    attributes:
      label: 预期行为
      description: 请描述您期望看到的正确行为
      placeholder: 应该显示关卡详情页面并正常加载所有内容
    validations:
      required: true
      
  - type: textarea
    id: actual-behavior
    attributes:
      label: 实际行为
      description: 请描述实际发生的情况
      placeholder: 页面显示白屏，控制台出现 JavaScript 错误
    validations:
      required: true
      
  - type: dropdown
    id: browser
    attributes:
      label: 浏览器
      description: 您使用的是什么浏览器？
      options:
        - Chrome
        - Firefox
        - Safari
        - Edge
        - Opera
        - 其他
    validations:
      required: true
      
  - type: input
    id: browser-version
    attributes:
      label: 浏览器版本
      description: 请提供浏览器的版本号
      placeholder: 例如：Chrome 120.0.6099.109
    validations:
      required: false
      
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      description: 您使用的操作系统
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
        - iOS
        - Android
        - 其他
    validations:
      required: true
      
  - type: dropdown
    id: device
    attributes:
      label: 设备类型
      description: 您使用的设备类型
      options:
        - 桌面电脑
        - 笔记本电脑
        - 平板电脑
        - 手机
    validations:
      required: true
      
  - type: textarea
    id: console-logs
    attributes:
      label: 控制台日志或错误信息
      description: 如果有控制台错误，请粘贴相关日志（按 F12 打开开发者工具查看）
      placeholder: |
        Error: Cannot read properties of undefined (reading 'xxx')
            at xxx.vue:xx:xx
      render: shell
    validations:
      required: false
      
  - type: textarea
    id: screenshots
    attributes:
      label: 截图或录屏
      description: 如果适用，请添加截图或录屏来帮助说明问题
      placeholder: 拖拽图片或视频文件到此处，或粘贴链接
    validations:
      required: false
      
  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息
      description: 提供任何其他有助于理解问题的上下文信息
      placeholder: |
        - 问题是否在其他浏览器中也会出现？
        - 问题是偶尔发生还是总是能重现？
        - 是否有任何特殊的网络环境？
    validations:
      required: false
      
  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 在提交之前，请确认以下内容
      options:
        - label: 我已经搜索过现有的 Issues，确认这不是重复报告
          required: true
        - label: 我已经查看过相关文档，确认这不是使用方式问题
          required: true
        - label: 我提供了足够的信息来重现这个问题
          required: true
