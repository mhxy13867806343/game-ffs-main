name: ✨ 功能请求
description: 提出新功能或改进建议
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        感谢您为项目提供改进建议！请详细描述您希望添加的功能或改进。
        
  - type: textarea
    id: feature-description
    attributes:
      label: 功能描述
      description: 请清晰简洁地描述您希望看到的功能或改进
      placeholder: 例如：希望在《裂空之羽》中添加多人协作模式，允许两名玩家共同完成关卡...
    validations:
      required: true
      
  - type: dropdown
    id: feature-area
    attributes:
      label: 功能类别
      description: 这个功能属于哪个方面？
      options:
        - 游戏玩法
        - 用户界面 (UI)
        - 用户体验 (UX)
        - 技术文档
        - 性能优化
        - 构建和部署
        - 移动端适配
        - 可访问性
        - 其他
    validations:
      required: true
      
  - type: dropdown
    id: affected-module
    attributes:
      label: 相关模块
      description: 此功能会影响哪个模块或页面？
      options:
        - 首页门户
        - 《裂空之羽》
        - 《最终幻想：时空之轮》
        - 技术白皮书文档
        - 全局功能（导航、搜索等）
        - 项目基础设施
        - 其他
    validations:
      required: true
      
  - type: textarea
    id: problem-statement
    attributes:
      label: 问题或痛点
      description: 请描述当前存在的问题或不便之处，说明为什么需要这个功能
      placeholder: |
        当前在游戏中切换不同章节时，需要返回首页再重新选择，操作较为繁琐。
        如果能在游戏内直接切换章节，将大大提升体验...
    validations:
      required: true
      
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议的解决方案
      description: 请描述您期望的功能实现方式
      placeholder: |
        建议在游戏界面右侧添加一个章节快速切换面板：
        1. 显示所有可用章节列表
        2. 标记当前章节和已完成章节
        3. 点击即可切换，无需返回首页
    validations:
      required: true
      
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 请描述您考虑过的其他可能的实现方式
      placeholder: |
        或者可以：
        - 在顶部导航栏添加下拉菜单
        - 使用键盘快捷键切换章节
    validations:
      required: false
      
  - type: dropdown
    id: priority
    attributes:
      label: 优先级
      description: 您认为这个功能的优先级如何？
      options:
        - 低 - 锦上添花的改进
        - 中 - 有明显价值的功能
        - 高 - 影响核心体验的重要功能
    validations:
      required: true
      
  - type: textarea
    id: use-cases
    attributes:
      label: 使用场景
      description: 请描述具体的使用场景，说明谁会使用这个功能，在什么情况下使用
      placeholder: |
        玩家在连续游玩多个章节时，可以快速切换而不中断游戏流程。
        文档查阅者在浏览不同技术白皮书时，能更便捷地导航。
    validations:
      required: false
      
  - type: textarea
    id: mockups
    attributes:
      label: 设计稿或示意图
      description: 如果有相关的设计稿、草图或参考示例，请在此提供
      placeholder: 拖拽图片文件到此处，或粘贴链接
    validations:
      required: false
      
  - type: textarea
    id: additional-context
    attributes:
      label: 附加信息
      description: 提供任何其他有助于理解和评估此功能的信息
      placeholder: |
        - 参考其他项目的类似实现
        - 相关的技术限制或考虑因素
        - 预期的影响范围
    validations:
      required: false
      
  - type: checkboxes
    id: terms
    attributes:
      label: 确认事项
      description: 在提交之前，请确认以下内容
      options:
        - label: 我已经搜索过现有的 Issues 和 Pull Requests，确认这不是重复的功能请求
          required: true
        - label: 我已经查看过项目文档和路线图，确认此功能尚未计划或实现
          required: true
        - label: 这个功能请求符合项目的整体方向和目标
          required: true
